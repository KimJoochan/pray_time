                const container = document.getElementById('qa-container');
                const allInputFields = []; // 힌트 토글을 위해 모든 input 저장

                // 랜덤 힌트 생성 함수 (정답에서 3~5글자만 남기고 나머지는 '◯' 처리)
                function generateHint(answer) {
                    const chars = answer.split('');
                    const validIndices = [];

                    chars.forEach((char, i) => {
                        if (char.trim() !== '' && char !== ',') validIndices.push(i);
                    });

                    const hintCount = Math.min(Math.floor(Math.random() * 3) + 3, validIndices.length);
                    const selectedIndices = validIndices.sort(() => 0.5 - Math.random()).slice(0, hintCount);

                    return chars.map((char, i) => {
                        if (char.trim() === '' || char === ',') return char;
                        if (selectedIndices.includes(i)) return char;
                        return '◯';
                    }).join('');
                }

                        // 툴팁 로직
                        let isTooltipOpen = false;

                            e.stopPropagation();

                                tooltipBtn.classList.remove('bg-indigo-50', 'text-indigo-500');
                            } else {
                                closeTooltip();
                            }
                        });

                        function closeTooltip() {
                            isTooltipOpen = false;
                            tooltipBox.classList.add('opacity-0', 'invisible', 'translate-y-2');
                            tooltipBox.classList.remove('opacity-100', 'visible', 'translate-y-0');
                            tooltipBtn.classList.remove('bg-indigo-600', 'text-white');
                            tooltipBtn.classList.add('bg-indigo-50', 'text-indigo-500');
                        }

                        document.addEventListener('click', (e) => {
                            if (isTooltipOpen && !tooltipContainer.contains(e.target)) {
                                closeTooltip();
                            }
                        });

                        // 조립
                        tooltipContainer.appendChild(tooltipBtn);
                        tooltipContainer.appendChild(tooltipBox);
